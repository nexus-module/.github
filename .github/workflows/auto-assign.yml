name: Auto-assign issue
on:
  workflow_call:
    inputs:
      teams:
        required: true
        type: string
    secrets:
      PAT_GITHUB:
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: "auto-assign issue"
        uses: pozil/auto-assign-issue@70adb98ca8b3941524e9ecde48e89067c4f96736 # v3.0.0
        with:
          repo-token: ${{ secrets.PAT_GITHUB }}
          teams: ${{ inputs.teams }}
          removePreviousAssignees: true
