name: Auto-assign issue
on:
  workflow_call:
    inputs:
      teams:
        required: true
        type: string
    secrets:
      PAT_GITHUB:
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: "auto-assign issue"
        uses: pozil/auto-assign-issue@07fe6dc0e9771842b428f5739098d6140734e226 # v4.0.0
        with:
          repo-token: ${{ secrets.PAT_GITHUB }}
          teams: ${{ inputs.teams }}
          removePreviousAssignees: true
