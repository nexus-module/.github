name: Release

on:
  workflow_call:
    inputs:
      semantic-release-version:
        description: "Version of semantic-release to use"
        required: false
        type: string
        default: "23.0.2"
      changelog-version:
        description: "Version of @semantic-release/changelog to use"
        required: false
        type: string
        default: "6.0.3"
      git-version:
        description: "Version of @semantic-release/git to use"
        required: false
        type: string
        default: "10.0.1"
      conventionalcommits-version:
        description: "Version of conventional-changelog-conventionalcommits to use"
        required: false
        type: string
        default: "7.0.2"
    secrets:
      PAT_GITHUB:
        required: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Skip running release workflow on forks
    if: github.repository_owner == 'nexus-module'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Release
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          semantic_version: ${{ inputs.semantic-release-version }}
          extra_plugins: |
            @semantic-release/changelog@${{ inputs.changelog-version }}
            @semantic-release/git@${{ inputs.git-version }}
            conventional-changelog-conventionalcommits@${{ inputs.conventionalcommits-version }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB }}
